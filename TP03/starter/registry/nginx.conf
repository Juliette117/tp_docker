server {
    listen 5000 ssl;
    server_name registry.local;

    ssl_certificate /etc/nginx/tls/registry.crt;
    ssl_certificate_key /etc/nginx/tls/registry.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 0;
    chunked_transfer_encoding on;
    auth_basic "Shop SAS registry";
    auth_basic_user_file /etc/nginx/auth/htpasswd;

    location = /healthz {
        auth_basic off;
        access_log off;
        return 200 "ok\n";
    }

    location /v2/ {
        # GET autorise aussi HEAD. Toute écriture exige le compte ci.
        limit_except GET {
            auth_basic_user_file /etc/nginx/auth/ci.htpasswd;
        }

        add_header Docker-Distribution-Api-Version "registry/2.0" always;
        proxy_hide_header Docker-Distribution-Api-Version;
        proxy_pass http://registry:5000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
    }

    # Même origine que l'API : pas de configuration CORS nécessaire.
    location / {
        limit_except GET {
            deny all;
        }
        proxy_pass http://ui:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
